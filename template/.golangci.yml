version: "2"
run:
  timeout: 5m
linters:
  default: none
  enable:
    - govet
    - staticcheck
    - unused
    - errcheck
    - ineffassign
    - depguard
    - cyclop
    - dupl
    - misspell
    - nolintlint
    - errorlint
    - errname
    - contextcheck
    - containedctx
    - forcetypeassert
    - gochecknoinits
    - gochecknoglobals
    - thelper
    - reassign
    - recvcheck
    - ireturn
    - revive
  settings:
    depguard:
      rules:
        domain:
          files:
            - "**/internal/text/*.go"
            - "!$test"
          list-mode: strict
          allow:
            - errors
            - strings
    cyclop:
      max-complexity: 10
    dupl:
      threshold: 100
    nolintlint:
      require-explanation: true
      require-specific: true
    ireturn:
      allow:
        - anon
        - error
        - stdlib
    revive:
      rules:
        - name: context-as-argument
          arguments:
            - allowTypesBefore: "*testing.T"
        - name: receiver-naming
        - name: exported
        - name: package-comments
        - name: time-naming
  exclusions:
    presets: []
    paths:
      - ^template/
formatters:
  enable:
    - gofmt
